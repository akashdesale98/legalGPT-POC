name: Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    name: RAGAS Evaluation
    runs-on: ubuntu-latest

    env:
      DEV_MODE: "true"
      DEV_TOKEN: "ci-dev-token"
      LLM_PROVIDER: "ollama"
      QDRANT_HOST: "localhost"
      QDRANT_PORT: "6334"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install eval dependencies
        run: pip install -r eval/requirements.txt

      - name: Start infrastructure
        run: docker compose -f deployments/docker/docker-compose.yml up -d

      - name: Wait for infrastructure
        run: |
          echo "Waiting for Qdrant..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/healthz > /dev/null 2>&1; then
              echo "Qdrant is up"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done

      - name: Build and start query service
        run: |
          go build -o bin/query-service ./services/query/...
          bin/query-service &
          echo "Waiting for query service..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/health/live > /dev/null 2>&1; then
              echo "Query service is up"
              break
            fi
            echo "Attempt $i/30..."
            sleep 3
          done

      - name: Run RAGAS evaluation
        env:
          DEV_TOKEN: "ci-dev-token"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python eval/ragas_eval.py --base-url http://localhost:8080
        continue-on-error: true

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: eval/results/
          retention-days: 30
